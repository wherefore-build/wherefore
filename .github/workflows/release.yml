# A RELEASE IS WHAT main SAYS, PUBLISHED - never typed. The version is
# pyproject.toml's, the notes are its CHANGELOG.md entry, and the commit is the
# one that declares it; this tags v<version> there and publishes the release,
# once. A push that declares a version already tagged does nothing.
#
# It is the release derived from its source, which is the engine's own rule
# applied to itself: nobody hand-writes a tag or release notes that could
# disagree with what the repository says. corpus/version_moves.py is what makes
# a new version arrive whenever the engine's code changes.
#
# workflow_dispatch with `ref` publishes an earlier commit's version that was
# never tagged - how v0.1.0, merged before this file existed, gets its tag.
#
# AND TO PyPI, ONLY WHEN THE OWNER HAS SWITCHED IT ON. The `pypi` job runs for a
# version this run newly tagged, and only while the repository variable
# PUBLISH_TO_PYPI is "true" - publishing is the owner's decision, made once,
# by setting it (PUBLISHING.md). It uploads by PyPI's trusted publishing: PyPI
# trusts this workflow in this repository, so no PyPI token is stored anywhere.
#
# AND EVERY CLIENT IS TOLD. Once the release is on PyPI, each repository that
# pins the engine is sent `engine-released` with the version, and its own
# workflow moves its pin, regenerates what the release lets through, and opens
# a draft pull request whose checks say what it still has to describe. Nothing
# merges by itself. Telling another repository takes a token that may write to
# it - CLIENTS_TOKEN, a fine-grained token the owner makes - and while there is
# none, the job says so and does nothing. The pendulum is not on the list: its
# pin moves by hand, deliberately, as its own requirements-engine.txt says.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: the commit whose declared version to tag and publish (default, the one pushed)
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and publish the version this commit declares, once
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          SHA=$(git rev-parse --verify "$REF^{commit}")
          V=$(git show "$SHA:pyproject.toml" | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ -z "$V" ]; then
            echo "::error::pyproject.toml at $SHA declares no version"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already tagged - nothing to publish."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$SHA:CHANGELOG.md" | awk -v h="## $V (" 'index($0, h) == 1 {on = 1; next} /^## / && on {exit} on' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md at $SHA has no entry for $V - a release says what it is"
            exit 1
          fi
          gh release create "v$V" --target "$SHA" --title "Wherefore $V" --notes-file notes.md
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  pypi:
    needs: publish
    if: needs.publish.outputs.tagged == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: Build the release that was just tagged
        run: |
          python3 -m pip install --quiet build
          python3 -m build
      - name: Upload it to PyPI, by trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  # AND EVERY ISSUE THE RELEASE ANSWERS IS TOLD, AND CLOSED. roadmap.json says
  # which (a shipped item, since this release, naming its issues), and
  # corpus/inbox.py writes what shipped onto each, once, with a line the
  # person's agent can read, then closes it.
  inbox:
    needs: publish
    if: needs.publish.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: What shipped, on each issue it answers, and the issue closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 corpus/inbox.py --shipped

  clients:
    needs: [publish, pypi]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLIENTS_TOKEN }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Tell every repository that pins the engine
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No CLIENTS_TOKEN, so no client is told of $VERSION. Make a fine-grained token with contents write on each client, and save it as CLIENTS_TOKEN in this repository's secrets."
            exit 0
          fi
          for client in wherefore-build/web; do
            gh api -X POST "repos/$client/dispatches" -f event_type=engine-released -f "client_payload[version]=$VERSION"
            echo "told $client: wherefore-build $VERSION is on PyPI"
          done
