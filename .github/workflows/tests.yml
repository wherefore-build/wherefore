# The engine, on its own: installed from this tree into a clean environment,
# its unit tests, and every proof - each of which breaks the fixture company one
# way and requires the right failure in the right words. Hosted, and short: a
# minute or two a run, on every pull request - a fork's included - and every
# push to main.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, test and prove
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet -e '.[pictures,xlsx]'
          python -m unittest discover -s tests
          for p in proofs/*_proof.py; do
            echo "== $p"
            python "$p"
          done

  # EVERY OTHER PYTHON pyproject.toml CLAIMS. 0.2.0 said 3.10 and did not even
  # import below 3.12 - a backslash inside an f-string - because CI only ever
  # ran the runner's own Python, which `engine` above still does. uv fetches
  # each interpreter, so no action has to be trusted for it.
  pythons:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Python ${{ matrix.python }}, by uv
        env:
          PY: ${{ matrix.python }}
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet uv
          "$RUNNER_TEMP/uv/bin/uv" venv --quiet --python "$PY" .venv
          "$RUNNER_TEMP/uv/bin/uv" pip install --quiet --python .venv/bin/python -e '.[pictures,xlsx]'
          .venv/bin/python --version
      - name: Test and prove
        run: |
          .venv/bin/python -m unittest discover -s tests
          for p in proofs/*_proof.py; do
            echo "== $p"
            .venv/bin/python "$p"
          done

  # THIS REPOSITORY AS A CLIENT OF ITSELF. Its README is generated, the
  # commands its documents name must exist, and the version must move with
  # the code - judged by the PREVIOUS release, installed from
  # requirements-engine.txt, never by this tree: a compiler builds itself with
  # its last release, so a change that broke the gate cannot pass its own
  # documents. Nothing here installs the tree being tested.
  corpus:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.wherefore-engine
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # corpus/version_moves.py compares with the last tag
      - name: Install the previous release, to judge this tree with
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/wherefore-build/wherefore.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/wherefore-build/wherefore
        run: python3 -m pip install --quiet --no-deps --target .wherefore-engine -r requirements-engine.txt
      - name: Every file is accounted for, and the README is what its sources make
        run: python3 -m wherefore gate
      - name: Every command a document names is one the CLI has
        run: python3 corpus/commands_named.py
      - name: The version moved if the engine did
        run: python3 corpus/version_moves.py
      - name: And each of those fails when it should
        run: python3 -m wherefore prove
      # WHERE IT STANDS, for the app. On main only, once everything above has
      # passed: `wherefore status` is this tree's own command (the release
      # this job judges with may not have it), and it judges nothing - the
      # gate it runs is only counted, the verdict above is the gate's.
      - name: Where this repository stands, kept for the app to read
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3 -m wherefore status --gate --out status.json
      - name: Keep it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: wherefore-status
          path: status.json
          retention-days: 30

  # EVERY COMMIT FROM OUTSIDE IS SIGNED OFF. A pull request from a fork comes
  # in under Apache-2.0 with each commit certifying the Developer Certificate
  # of Origin (CONTRIBUTING.md): a `Signed-off-by:` line naming the commit's
  # author, as `git commit -s` writes it. A branch of this repository is the
  # project's own, and is not asked.
  sign-off:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit in the pull request is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$c")"
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git show -s --format='%h %s' "$c") is not signed off by its author, $author"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off each commit with git commit -s (CONTRIBUTING.md); git rebase --signoff $BASE adds it to commits already made."
            exit 1
          fi
          echo "every commit is signed off by its author"
