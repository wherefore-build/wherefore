[build-system]
# 77 for the licence as an SPDX expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wherefore-build"
version = "0.24.0"
description = "A company that compiles: every asset generated from one source of truth, every change proven."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Wherefore", email = "hello@wherefore.build"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["build", "documentation", "single source of truth", "ci", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://wherefore.build"
Repository = "https://github.com/wherefore-build/wherefore"

[project.optional-dependencies]
# The comparators that are not bytes. The core is the standard library only,
# as the observer, the proof harness and the runner always were.
pictures = ["pillow", "numpy"]
xlsx = ["openpyxl"]

[project.scripts]
wherefore = "wherefore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The observer is a module called sitecustomize in a directory that holds
# nothing else, put on PYTHONPATH - not a package, so it is shipped as data.
# The commands, the principles, the features and the releases are said once
# each, here, and a client that states them - the company's site - reads them
# from the release it pins. The skill ships too: a corpus's agents read the
# release's own, written by the wherefore.skill generator, never a copy kept by
# hand.
wherefore = ["_observe/sitecustomize.py", "commands.json", "features.json", "principles.json",
             "releases.json", "skills/wherefore/SKILL.md", "skills/wherefore/start.md",
             "docs/commands.md", "docs/configuration.md", "docs/checks.md", "docs/reporting.md",
             "workflows/wherefore-pin.yml"]
