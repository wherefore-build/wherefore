[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is wherefore-build: `wherefore` on PyPI is another project's
# (DECISIONS.md in wherefore-co, section 2). What is imported and what is typed
# are still `wherefore`.
name = "wherefore-build"
version = "0.3.0"
description = "A company that compiles: every asset generated from one source of truth, every change proven."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []
keywords = ["build", "documentation", "single source of truth", "ci", "agents"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# The comparators that are not bytes. The core is the standard library only,
# as the observer, the proof harness and the runner always were.
pictures = ["pillow", "numpy"]
xlsx = ["openpyxl"]

[project.scripts]
wherefore = "wherefore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The observer is a module called sitecustomize in a directory that holds
# nothing else, put on PYTHONPATH - not a package, so it is shipped as data.
# The commands and the principles are said once each, here, and a client that
# states them - the company's site - reads them from the release it pins. The
# skill ships too: a corpus's agents read the release's own, written by the
# wherefore.skill generator, never a copy kept by hand.
wherefore = ["_observe/sitecustomize.py", "commands.json", "principles.json",
             "skills/wherefore/SKILL.md", "skills/wherefore/start.md"]
